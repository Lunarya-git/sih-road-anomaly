# Dataset config for Ultralytics YOLO segmentation training.
# `path` is the dataset root; train/val/test below are resolved relative to it.
# Adjust `path` if your folder name/location differs.

path: "../data/Potholes and Roads Instance Segmentation.v5i.yolov8"
train: train/images
val: valid/images
test: test/images

nc: 1
names: ['pothole']

# Source: https://universe.roboflow.com/pothole-vsmtu/potholes-and-roads-instance-segmentation
